<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Página de Login</title>
</head>
<body>
    <section class="fundo-">
        <div class="login" id="login1">
            <h1 class="titulo">Bem vindo!</h1>

            <form class="input">
                <label>Login</label>
                <input type="email" placeholder="Digite seu login">

                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha">
            </form>

            <button class="botao-">Entrar</button>
            <p class="texto">Não tem conta? <a href="#login2">Clique aqui</a></p>
        </div>
    </section>    

<!--página DOIS-->    

    <section class="fundo- fundo2">
        <div class="login-2" id="login2">
            <h1>Bem vindo!</h1>
            <h2>Crie sua conta</h2>

            <form class="input">
                <label>E-mail</label>
                <input type="email" placeholder="exemplo@email.com">

                <label>Telefone</label>
                <input type="tel" placeholder="+55 DDD + número">

                <label>Nome</label>
                <input type="text" placeholder="Seu nome completo">

                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha">

                <div class="checkboxdiv">
                    <input class="checkbox" type="checkbox">
                    <label class="termos">Ao "Cadastrar", aceito os <a href="">Termos e condições</a> e
                        autorizo o uso dos meus dados de acesso com a
                        <a href="">Declaração de privacidade</a>.</label>
                </div>
                
            </form>
            <button class="botao-">Cadastrar</button>
        </div>    
    </section>
    
    <div class="fundo">
        <img src="./imagem-.png" alt="Imagem menino de bicicleta">
    </div>


</body>
</html>
