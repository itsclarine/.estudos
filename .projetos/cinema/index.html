<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>LetterBoxd</title>
</head>
<body>
  <section>
    <nav class="menu">
      <div class="logo">
        <img src="./src/Logo.png" alt="" class="logo-img">
        <h1>LetterBoxd</h1>
      </div>

      <div class="menu-links">
        <a href="#">SIGN IN</a>
        <a href="#">CREATE ACOUNT</a>
        <a href="#">SERIES</a>
        <a href="#">JOURNAL</a>
        <input class="nav-pesquisa" type="search" >
      </div>
    </nav>
  </section>  

  <main>
    <section>
      <div class="imagem-geral">
        <img src="./src/image.png" alt="" class="imagem">
      </div>

      <div class="texto">
        <h3 class="texto-">Track films you’ve watched. <br>
            Save those you want to see. <br>
            Tell your friends what’s good. 
        </h3>
      </div>

      <div class="botao">
        <a href="#">
          <button class="botao-">Get started — it's free!</button>
        </a>  
      </div>
    </section>

    <section class="parte-dois">
      <h4 class="texto-dois">The social network for series lovers.</h4>

      <div class="cards">
        <img src="" alt="" class="cards-imagem">
        <h2 class="cards-texto">Stranger Things</h2>
      </div>

    </section>


  </main>


</body>
</html>
